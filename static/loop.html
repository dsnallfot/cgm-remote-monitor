<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Öppnar Loop Follow...</title>
    <script>
        // Skickar användaren direkt till appen
        window.location.href = "loop://";
        
        // Reservplan: Om appen inte öppnas direkt, försök igen efter en kort stund
        setTimeout(function() {
            window.location.href = "loop://";
        }, 500);
    </script>
</head>
<body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">
        Öppnar Loop Follow... Om appen inte startar, <a href="loop://">klicka här</a>.
    </p>
</body>
</html>
